# Keep the Compose project name stable when reusing its data volumes.
services:
  litellm:
    # Tested LiteLLM 1.104.0 image. Override LITELLM_IMAGE to test an upgrade.
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839}
    ports:
      - "${LITELLM_BIND:-127.0.0.1:}${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - chatgpt_tokens:/var/lib/litellm/chatgpt
    command:
      - "--config"
      - "/app/config.yaml"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/litellm
      # .env is used for interpolation; pass provider variables explicitly.
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      STORE_MODEL_IN_DB: "True"
      CHATGPT_TOKEN_DIR: /var/lib/litellm/chatgpt
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  chatgpt_tokens:
